name: Pi 4

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DIR: build-ci
      PI4_TEST_CACHE_DIR: ${{ github.workspace }}/.cache/pi4-tests

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned Meson subprojects
        id: meson-subprojects-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            subprojects/berkeley-softfloat-3
            subprojects/berkeley-testfloat-3
            subprojects/keycodemapdb
          key: pi4-meson-subprojects-v1-${{ hashFiles('subprojects/berkeley-softfloat-3.wrap', 'subprojects/berkeley-testfloat-3.wrap', 'subprojects/keycodemapdb.wrap') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libfdt-dev \
            libglib2.0-dev \
            libpixman-1-dev \
            meson \
            ninja-build \
            pkg-config \
            python3-setuptools \
            python3-venv \
            python3-wheel

      - name: Fetch pinned Meson subprojects
        if: steps.meson-subprojects-cache.outputs.cache-hit != 'true'
        run: |
          meson subprojects download \
            berkeley-softfloat-3 \
            berkeley-testfloat-3 \
            keycodemapdb

      - name: Configure focused Pi 4 build
        run: |
          mkdir "$BUILD_DIR"
          cd "$BUILD_DIR"
          if ! PYTHON=/usr/bin/python3 ../configure \
              --target-list=aarch64-softmmu \
              --without-default-devices \
              --with-devices-aarch64=pi4 \
              --disable-docs \
              --disable-tools \
              --disable-download >configure-output.log 2>&1; then
            cat configure-output.log
            message="$(tail -n 10 configure-output.log | tr '\n' ' ')"
            echo "::error title=QEMU configure failed::$message"
            exit 1
          fi
          cat configure-output.log

      - name: Restore pinned Linux guest cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PI4_TEST_CACHE_DIR }}/download
          key: pi4-linux-v1-${{ hashFiles('tests/functional/aarch64/test_raspi4.py') }}
          restore-keys: |
            pi4-linux-v1-

      - name: Precache pinned Linux guest
        run: make -C "$BUILD_DIR" precache-pi4 PI4_TEST_CACHE_DIR="$PI4_TEST_CACHE_DIR"

      - name: Build and run offline Pi 4 gate
        run: |
          if ! make -C "$BUILD_DIR" -j2 check-pi4 \
              PI4_TEST_CACHE_DIR="$PI4_TEST_CACHE_DIR" 2>&1 | tee pi4-check.log; then
            message="$(tail -n 10 pi4-check.log | tr '\n' ' ')"
            echo "::error title=Pi 4 gate failed::$message"
            exit 1
          fi
